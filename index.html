<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contagem Regressiva | Natal e Ano Novo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Contagem Regressiva</h1>



    <!-- ANO NOVO -->
    <section class="box">
      <h2>🎆 Ano Novo 2026</h2>
      <div class="timer">
        <div><span class="ny-days">00</span><small>Dias</small></div>
        <div><span class="ny-hours">00</span><small>Horas</small></div>
        <div><span class="ny-minutes">00</span><small>Minutos</small></div>
        <div><span class="ny-seconds">00</span><small>Segundos</small></div>
      </div>
    </section>

    <!-- NATAL -->
    <section class="box">
      <h2>🎄 Natal 2025</h2>
      <div class="timer">
        <div><span class="x-days">00</span><small>Dias</small></div>
        <div><span class="x-hours">00</span><small>Horas</small></div>
        <div><span class="x-minutes">00</span><small>Minutos</small></div>
        <div><span class="x-seconds">00</span><small>Segundos</small></div>
      </div>
    </section>

  </div>
  <div id="relogio01" class="clock"></div>
  <div id="date" class="date"></div>

  <div class="wrapper">
  <script src="app.js"></script>
</body>
</html>
