<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Contagem Regressiva Natal e Ano Novo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Contagem Regressiva</h1>

  <div class="wrapper">

    <!-- NATAL -->
    <div class="box">
      <h2>🎄 Natal</h2>
      <div class="timer">
        <div>
          <span class="natal-dias">00</span>
          <small>Dias</small>
        </div>
        <div>
          <span class="natal-horas">00</span>
          <small>Horas</small>
        </div>
        <div>
          <span class="natal-minutos">00</span>
          <small>Min</small>
        </div>
        <div>
          <span class="natal-segundos">00</span>
          <small>Seg</small>
        </div>
      </div>
    </div>

    <!-- ANO NOVO -->
    <div class="box">
      <h2>🎆 Ano Novo</h2>
      <div class="timer">
        <div>
          <span class="ano-dias">00</span>
          <small>Dias</small>
        </div>
        <div>
          <span class="ano-horas">00</span>
          <small>Horas</small>
        </div>
        <div>
          <span class="ano-minutos">00</span>
          <small>Min</small>
        </div>
        <div>
          <span class="ano-segundos">00</span>
          <small>Seg</small>
        </div>
      </div>
    </div>

  </div>

  <!-- RELÓGIO BRASÍLIA -->
  <div class="clock" id="clock"></div>
  <div class="date" id="date"></div>

  <script src="app.js"></script>
</body>
</html>
