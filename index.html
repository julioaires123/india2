<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contagem Regressiva Natal 2025</title>
</head>
<body>

    <h1>Contagem Regressiva Natal 2025 🎄</h1>

    <div class="timer">
        <div class="countdown-container">
            <div class="time Dias">00</div>
            <span class="text">Dias</span>
        </div>

        <div class="countdown-container">
            <div class="time Horas">00</div>
            <span class="text">Horas</span>
        </div>

        <div class="countdown-container">
            <div class="time Minutos">00</div>
            <span class="text">Minutos</span>
        </div>

        <div class="countdown-container">
            <div class="time Segundos">00</div>
            <span class="text">Segundos</span>
        </div>
    </div>

    <h1 class="feliz">🎅 Feliz Natal!</h1>

    <script src="app.js"></script>
</body>
</html>
